document.getElementById('rmsModalClose').onclick=hideRmsModal;let markup='<section class="scene"><div class="panel"><p class="kicker">DIN VARDAG · NÄSTA NIVÅ</p><h1>Förenkla och effektivisera vårt arbete</h1><p>På några minuter hjälper du oss hitta konkreta möjligheter till förenkling. Fundera gärna på frågan: "Vad borde egentligen gå snabbare än det gör idag?".</p><p class="hint">Anonymt · cirka 3–5 minuter</p><button class="start" data-go="1">Starta resan</button></div></section>';
