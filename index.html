:root{--cream:#e6e6d7;--cream2:#f1f0e5;--burg:#5d0f19;--green:#254336;--black:#212529;--grey:#d0c8c0}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--black);color:var(--cream2);font-family:Garamond,"Times New Roman",serif;overflow-x:hidden}.mediaStage{position:fixed;inset:0;z-index:-5;overflow:hidden;background:#212529}.mediaLayer{position:absolute;inset:-4%;opacity:0;transition:opacity .18s linear;will-change:opacity,transform}.mediaLayer img,.mediaLayer video{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.82) contrast(1.06)}.mediaLayer video{background:#212529}.shade{position:absolute;inset:0;z-index:3;background:linear-gradient(90deg,rgba(18,20,21,.90),rgba(18,20,21,.67) 44%,rgba(18,20,21,.30) 78%,rgba(18,20,21,.70)),linear-gradient(rgba(33,37,41,.63),transparent 22%,transparent 77%,rgba(33,37,41,.84))}.grain{position:absolute;inset:0;z-index:4;opacity:.045;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}.top{position:fixed;z-index:20;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:22px 4vw;background:linear-gradient(#151718d8,transparent)}.logo{width:clamp(190px,22vw,330px)}.status,.kicker,.choice,.chip,button,.cue{font-family:"Gill Sans","Gill Sans MT",Calibri,sans-serif;text-transform:uppercase;letter-spacing:1.5pt}.status{font-size:.72rem}.rail{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:25;display:grid;gap:11px}.dot{width:10px;height:10px;padding:0;border-radius:50%;border:1px solid #f1f0e5ad;background:#e6e6d733}.dot.on{background:var(--cream2);box-shadow:0 0 15px #f1f0e5ba;transform:scale(1.3)}.scene{min-height:145vh;display:grid;place-items:center;padding:120px 7vw}.panel{width:min(900px,calc(100vw - 92p const Q=[{id:'role',q:'Vilken grupp tillhör du?',h:'Frivilligt. Svaret används endast för att se mönster mellan grupper.',type:'choice',req:false,o:['Revenue Manager','Revenue Styrgrupp','Revenue Admin','Annat']},{id:'time',q:'Vilka arbetsuppgifter lägger du mest tid på under en normal vecka?',h:'Beskriv gärna 1–3 konkreta exempel.',c:['Rapportering','Prognos och budget','Informationssökning','Möten och uppföljning','Datainsamling och sammanställning']},{id:'manual',q:'Vad är mest manuellt eller repetitivt?',h:'Tänk på uppgifter som återkommer eller kräver samma handgrepp.',c:['Kopiera mellan system','Uppdatera Excel-mallar','Återkommande mejl','Manuella kontroller']},{id:'friction',q:'Vad skapar mest frustration eller ineffektivitet?',h:'Beskriv gärna situationen och vilken konsekvens den får.',c:['Väntetider','Otydliga processer','Dubbelarbete','Svårt att hitta information']},{id:'automation',q:'Om du kunde spara tid på tre arbetsuppgifter, vilka skulle ge störst effekt för dig?',h:'Prioritera gärna de viktigaste först.',c:['Rapportering','Administration','Informationssökning','Kommunikation','Datainsamling','Statistik och analys']},{id:'other',q:'Har du övriga förbättringsförslag?',h:'Något som borde förenklas, automatiseras, förbättras eller tas bort?',c:['Minska dubbelarbete','Samla information','Förenkla rapportering'],req:false}];
const stage=document.getElementById('mediaStage');const stageAnchor=stage.querySelector('.shade');media.forEach((m,i)=>{let layer=document.createElement('div');layer.className='mediaLayer';layer.dataset.i=i;if(m.type==='video'){let v=document.createElement('video');v.src=m.src;if(m.poster)v.poster=m.poster;v.muted=true;v.loop=true;v.autoplay=true;v.playsInline=true;v.preload=i<2?'auto':'metadata';v.setAttribute('aria-hidden','true');v.addEventListener('error',()=>{if(m.required){layer.innerHTML='<div style="width:100%;height:100%;display:grid;place-items:center;background:#212529;color:#e6e6d7;font-family:Gill Sans,Calibri,sans-serif;letter-spacing:1.5pt;text-transform:uppercase">hero.mp4 saknas eller kan inte spelas</div>'}else{layer.innerHTML='<img src="'+m.poster+'" alt="">'}});layer.appendChild(v)}else{layer.innerHTML='<img src="'+m.src+'" alt="">'}stage.insertBefore(layer,stageAnchor)});const layers=[...document.querySelectorAll('.mediaLayer')];

Q.forEach((x,i)=>{let input=x.type==='choice'?'<div class="choices">'+x.o.map(o=>'<button class="choice" data-q="'+x.id+'" data-v="'+o+'">'+o+'</button>').join('')+'</div><div class="roleOther" id="roleOther"><input id="roleOtherInput" maxlength="120" placeholder="Beskriv din roll..."></div>':'<textarea data-q="'+x.id+'" maxlength="2500" placeholder="Skriv fritt här..."></textarea><p class="hint">Inspiration:</p><div class="chips">'+x.c.map(c=>'<button class="chip" data-chip="'+x.id+'">'+c+'</button>').join('')+'</div>';markup+='<section class="scene"><div class="panel"><p class="kicker">FRÅGA '+(i+1)+' AV '+Q.length+'</p><h2>'+x.q+'</h2><p class="hint">'+x.h+'</p>'+input+'<div class="nav"><button class="back" data-go="'+i+'">Tillbaka</button><button class="primary" data-go="'+(i+2)+'">Fortsätt</button></div></div></section>'});markup+='<section class="scene"><div class="panel"><p class="kicker">SLUTKOLL</p><h2>Ser allt rätt ut?</h2><div class="review" id="review"></div><p class="error" id="err"></p><div class="nav"><button class="back" data-go="6">Tillbaka</button><button class="submit" id="submit">Skicka svar</button></div></div></section><section class="scene">

</section>';markup+='<div class="modalBackdrop" id="rmsModal" role="dialog" aria-modal="true"><div class="modalBox"><p class="kicker">EN ANNAN TYP AV FEEDBACK</p><h2>Beskriv arbetsmomentet i stället</h2><p>Den här enkäten fokuserar på processer, arbetssätt och möjliga förbättringar.</p><p>Beskriv gärna vad du försöker göra i stället för vilket system som används. Feedback och utvecklingsförslag om RMS hanteras i separata enkäter.</p><div class="modalExample">Exempel: ”Det tar lång tid att uppdatera prognoser och kontrollera priser manuellt.”</div><div class="modalActions"><button class="primary" id="editRmsAnswer">Ändra svaret</button></div></div></div>';app.innerHTML=markup;const scenes=[...document.querySelectorAll('.scene')],rail=document.getElementById('rail');rail.innerHTML=scenes.map((_,i)=>'<button class="dot" data-go="'+i+'"></button>').join('');
function go(i){i=Math.max(0,Math.min(i,scenes.length-1));current=i;scenes.forEach(s=>s.classList.remove('focus'));let s=scenes[i],p=s.querySelector('.panel');s.classList.add('focus');window.scrollTo({top:p.getBoundingClientRect().top+scrollY-(innerHeight-p.offsetHeight)/2,behavior:'smooth'});setTimeout(()=>s.classList.remove('focus'),900);if(i===7)review()}
function review(){document.getElementById('review').innerHTML=Q.map(x=>'<article><b>'+x.q+'</b>'+esc(ans[x.id]||'Ej besvarad')+'</article>').join('')}
const rmsPattern=/\b(?:wave|rms)\b/i;let blockedTextarea=null;function rmsGate(target){let ta=scenes[current]?.querySelector('textarea');if(target>current&&ta&&rmsPattern.test(ta.value)){blockedTextarea=ta;document.getElementById('rmsModal').classList.add('open');return false}return true}document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{let target=+b.dataset.go;if(rmsGate(target))go(target)});document.getElementById('editRmsAnswer').onclick=()=>{document.getElementById('rmsModal').classList.remove('open');blockedTextarea?.focus()};document.querySelectorAll('.choice').forEach(b=>b.onclick=function(){ans[this.dataset.q]=this.dataset.v;localStorage.setItem('wq9Draft',JSON.stringify(ans));document.querySelectorAll('[data-q="'+this.dataset.q+'"]').forEach(x=>x.classList.remove('sel'));this.classList.add('sel');let ro=document.getElementById('roleOther');if(ro)ro.classList.toggle('show',this.dataset.q==='role'&&this.dataset.v==='Annat')});const roleOtherInput=document.getElementById('roleOtherInput');if(roleOtherInput){if(String(ans.role||'').startsWith('Annat: ')){roleOtherInput.value=String(ans.role).slice(7);document.getElementById('roleOther').classList.add('show')}roleOtherInput.oninput=()=>{ans.role=roleOtherInput.value.trim()?'Annat: '+roleOtherInput.value.trim():'Annat';localStorage.setItem('wq9Draft',JSON.stringify(ans))}};document.querySelectorAll('textarea').forEach(t=>{t.value=ans[t.dataset.q]||'';t.oninput=()=>{ans[t.dataset.q]=t.value;localStorage.setItem('wq9Draft',JSON.stringify(ans))}});document.querySelectorAll('.chip').forEach(b=>b.onclick=function(){let t=document.querySelector('textarea[data-q="'+this.dataset.chip+'"]');t.value+=(t.value?'\n':'')+this.textContent+': ';t.dispatchEvent(new Event('input'));t.focus()});addEventListener('keydown',e=>{if(document.activeElement.tagName==='TEXTAREA'&&e.key!=='Escape')return;if(['ArrowDown','PageDown'].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowUp','PageUp'].includes(e.key)){e.p function frame(){let center=innerHeight/2,near=0,best=1e9;scenes.forEach((s,i)=>{let r=s.getBoundingClientRect(),d=Math.abs(r.top+r.height/2-center);if(d<best){best=d;near=i}let cd=d/innerHeight,v=cd<.43?1:Math.max(0,1-(cd-.43)/.5),p=s.querySelector('.panel'),dir=(r.top+r.height/2-center)/innerHeight;p.style.opacity=.08+v*.92;p.style.filter='blur('+((1-v)*5)+'px)';p.style.transform='translateY('+(dir*55)+'px) scale('+(0.95+v*.05)+')'});current=near;status.textContent = near === 0 ? 'START' : near <= 6 ? 'FRÅGA ' + near + ' / 6' : near === 7 ? 'SLUTKOLL' : 'KLART';document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===near));let max=Math.max(1,document.documentElement.scrollHeight-innerHeight),p=scrollY/max,seg=p*(layers.length-1),i=Math.floor(seg),t=seg-i,s=t*t*(3-2*t),next=Math.min(i+1,layers.length-1);layers.forEach((l,j)=>{l.style.opacity=j===i?1-s:j===next?s:0;l.style.transform='scale('+(1.07+Math.abs(j-seg)*.025)+') translateX('+((j-seg)*1.2)+'vw)';let v=l.querySelector('video');if(v){if(l.style.opacity>.04)v.play().catch(()=>{});else v.pause()}});document.getElementById('cue').classList.toggle('hidden',scrollY>innerHeight*.28);requestAnimationFrame(frame)}frame();
